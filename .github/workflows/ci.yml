name: CI

on:
  push:
    branches-ignore: [master]
  pull_request:
    branches: [master]
    # edited, so that adding or removing [no release] in the title re-runs
    # the checks (all of them, since the gate stands for the whole run)
    types: [opened, synchronize, reopened, edited]
  workflow_call: # run by the release workflow before it builds

permissions:
  contents: read

jobs:
  go:
    name: Go lint and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.14.0

      - name: Test
        run: go test ./...

  terraform:
    name: Terraform lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: terraform
    steps:
      - uses: actions/checkout@v7

      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_wrapper: false

      - name: Format
        run: terraform fmt -check -recursive -diff

      - name: Validate
        run: |
          terraform init -backend=false -input=false
          terraform validate

      - uses: terraform-linters/setup-tflint@v6
        with:
          tflint_version: v0.64.0

      # config.json is not committed; the example's values are enough for the rules
      - name: TFLint
        env:
          GITHUB_TOKEN: ${{ github.token }} # avoids rate limits when downloading the plugin
        run: |
          tflint --init
          tflint --format compact --var=config_file_path=../config.example.json

  android:
    name: Android test and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # The Gradle daemon is pinned to JDK 25 (android/gradle/gradle-daemon-jvm.properties)
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25

      - uses: gradle/actions/setup-gradle@v6

      # The runner has the Android SDK; Gradle installs the platform it needs
      - name: Unit tests and lint
        run: make android-test

      # Debug-signed, to check the minified release build
      - name: Build release APK
        run: make android

  version:
    name: Next version is unused
    # A pull request with [no release] (any case) in its title is merged
    # without a release, so it needn't bump VERSION
    if: github.event_name == 'pull_request' && !contains(github.event.pull_request.title, '[no release]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Check VERSION
        env:
          BASE_REF: ${{ github.base_ref }}
        run: bash .github/scripts/check-version.sh

  # The one check required by the master branch ruleset; add new jobs to needs
  gate:
    name: CI gate
    if: always()
    needs: [go, terraform, android, version]
    runs-on: ubuntu-latest
    steps:
      - name: Require every check to pass
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "Results: $RESULTS"
          for result in $RESULTS; do
            [[ $result == success || $result == skipped ]] || exit 1
          done
