name: CI

on:
  push:
    branches-ignore: [master]
  pull_request:
    branches: [master]
  workflow_call: # run by the release workflow before it builds

permissions:
  contents: read

jobs:
  go:
    name: Go lint and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.14.0

      - name: Test
        run: go test ./...

  terraform:
    name: Terraform lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: terraform
    steps:
      - uses: actions/checkout@v7

      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_wrapper: false

      - name: Format
        run: terraform fmt -check -recursive -diff

      - name: Validate
        run: |
          terraform init -backend=false -input=false
          terraform validate

      - uses: terraform-linters/setup-tflint@v6
        with:
          tflint_version: v0.64.0

      # config.json is not committed; the example's values are enough for the rules
      - name: TFLint
        env:
          GITHUB_TOKEN: ${{ github.token }} # avoids rate limits when downloading the plugin
        run: |
          tflint --init
          tflint --format compact --var=config_file_path=../config.example.json

  version:
    name: Next version is unused
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Check VERSION
        env:
          BASE_REF: ${{ github.base_ref }}
        run: bash .github/scripts/check-version.sh

  # The one check required by the master branch ruleset; add new jobs to needs
  gate:
    name: CI gate
    if: always()
    needs: [go, terraform, version]
    runs-on: ubuntu-latest
    steps:
      - name: Require every check to pass
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "Results: $RESULTS"
          for result in $RESULTS; do
            [[ $result == success || $result == skipped ]] || exit 1
          done
