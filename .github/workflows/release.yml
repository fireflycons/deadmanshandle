name: Release

on:
  push:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  checks:
    uses: ./.github/workflows/ci.yml

  release:
    name: Build and release
    needs: checks
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # history and tags, for the release notes

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Check VERSION
        id: version
        run: bash .github/scripts/check-version.sh

      - name: Build
        run: make build

      # The QR code CLI runs on the deployer's computer, so it is built for
      # each desktop platform
      - name: Build QR code CLI
        run: |
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64 windows/arm64; do
            os=${target%/*} arch=${target#*/} ext=
            [[ $os == windows ]] && ext=.exe
            CGO_ENABLED=0 GOOS=$os GOARCH=$arch go build -o "bin/qrconfig/qrconfig-$os-$arch$ext" ./cmd/qrconfig
          done

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25

      - uses: gradle/actions/setup-gradle@v6

      # Signed with the release key, so each release can update the last.
      # Without it the APK would be debug-signed with a key unique to this
      # runner, so the build fails instead.
      - name: Build Android app
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          if [[ -z $ANDROID_KEYSTORE_BASE64 || -z $ANDROID_KEYSTORE_PASSWORD || -z $ANDROID_KEY_ALIAS ]]; then
            echo "::error::The ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD and ANDROID_KEY_ALIAS secrets are required"
            exit 1
          fi
          export ANDROID_KEYSTORE_FILE="$RUNNER_TEMP/release.jks"
          base64 -d <<< "$ANDROID_KEYSTORE_BASE64" > "$ANDROID_KEYSTORE_FILE"
          make android
          rm "$ANDROID_KEYSTORE_FILE"

      # One zip, unpacking to deadmanshandle-v<VERSION>/ ready to deploy: the
      # Terraform configuration and example config laid out as in the
      # repository, each Lambda's executable bootstrap in bin/ where Terraform
      # expects it, the Android check-in app in app/, and the QR code CLI
      # that sets the app up in qrconfig/.
      - name: Package
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          pkg="deadmanshandle-v$VERSION"
          mkdir dist stage
          git archive --format=tar --prefix="$pkg/" \
            HEAD terraform config.example.json LICENSE ':!terraform/.tflint.hcl' \
            | tar -x -C stage
          for fn in http scheduled docwatch alarmpush; do
            install -D -m 755 "bin/$fn/bootstrap" "stage/$pkg/bin/$fn/bootstrap"
          done
          install -D -m 644 android/app/build/outputs/apk/release/app-release.apk "stage/$pkg/app/$pkg.apk"
          install -D -m 755 -t "stage/$pkg/qrconfig" bin/qrconfig/*
          (cd stage && zip -X -q -r "../dist/$pkg.zip" "$pkg")
          (cd dist && sha256sum *.zip > SHA256SUMS)

      - name: Release notes
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          prev=$(git tag --merged HEAD -l 'v[0-9]*' --sort=-v:refname | head -n 1)
          {
            echo "To deploy without building, see [Deploying from a Release](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/blob/v${VERSION}/DEPLOYMENT.md#deploying-from-a-release)."
            echo
            if [[ -n $prev ]]; then
              echo "## Changes since $prev"
            else
              echo "## Changes"
            fi
            echo
            git log --no-merges --format='- %s (%h)' "${prev:+$prev..}HEAD"
            if [[ -n $prev ]]; then
              echo
              echo "**Full changelog:** ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/compare/${prev}...v${VERSION}"
            fi
          } > notes.md
          cat notes.md

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          gh release create "v$VERSION" dist/* \
            --target "$GITHUB_SHA" \
            --title "v$VERSION" \
            --notes-file notes.md
