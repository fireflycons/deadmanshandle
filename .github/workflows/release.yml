name: Release

on:
  push:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  checks:
    uses: ./.github/workflows/ci.yml

  release:
    name: Build and release
    needs: checks
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # history and tags, for the release notes

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Check VERSION
        id: version
        run: bash .github/scripts/check-version.sh

      - name: Build
        run: make build

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25

      - uses: gradle/actions/setup-gradle@v6

      # Signed with the release key, so each release can update the last.
      # Without it the APK would be debug-signed with a key unique to this
      # runner, so the build fails instead.
      - name: Build Android app
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          if [[ -z $ANDROID_KEYSTORE_BASE64 || -z $ANDROID_KEYSTORE_PASSWORD || -z $ANDROID_KEY_ALIAS ]]; then
            echo "::error::The ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD and ANDROID_KEY_ALIAS secrets are required"
            exit 1
          fi
          export ANDROID_KEYSTORE_FILE="$RUNNER_TEMP/release.jks"
          base64 -d <<< "$ANDROID_KEYSTORE_BASE64" > "$ANDROID_KEYSTORE_FILE"
          make android
          rm "$ANDROID_KEYSTORE_FILE"

      # Each zip holds an executable bootstrap at its root, ready for Lambda.
      # The tarball has the Terraform configuration and example configs, laid
      # out as in the repository, so the zips unpack into its bin/ directory.
      # The APK is the Android check-in app.
      - name: Package
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          mkdir dist
          for fn in http scheduled docwatch alarmpush; do
            (cd "bin/$fn" && zip -X -q "../../dist/$fn.zip" bootstrap)
          done
          git archive --format=tar.gz --prefix="deadmanshandle-v$VERSION/" \
            -o "dist/deadmanshandle-terraform-v$VERSION.tar.gz" \
            HEAD terraform config.example.json LICENSE ':!terraform/.tflint.hcl'
          cp android/app/build/outputs/apk/release/app-release.apk "dist/deadmanshandle-v$VERSION.apk"
          (cd dist && sha256sum *.zip *.tar.gz *.apk > SHA256SUMS)

      - name: Release notes
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          prev=$(git tag --merged HEAD -l 'v[0-9]*' --sort=-v:refname | head -n 1)
          {
            echo "To deploy without building, see [Deploying from a Release](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/blob/v${VERSION}/DEPLOYMENT.md#deploying-from-a-release)."
            echo
            if [[ -n $prev ]]; then
              echo "## Changes since $prev"
            else
              echo "## Changes"
            fi
            echo
            git log --no-merges --format='- %s (%h)' "${prev:+$prev..}HEAD"
            if [[ -n $prev ]]; then
              echo
              echo "**Full changelog:** ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/compare/${prev}...v${VERSION}"
            fi
          } > notes.md
          cat notes.md

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          gh release create "v$VERSION" dist/* \
            --target "$GITHUB_SHA" \
            --title "v$VERSION" \
            --notes-file notes.md
